<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Visidtdas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Header alternativo para iOS -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Vidsitdas</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item button detail (click)="abrirFormulario(visita)" *ngFor="let visita of visitas">
      <ion-label>
        <h3>Famoso ID: {{ visita.famosos_id }}</h3>
        <p>Sitio ID: {{ visita.sitio_id }}</p>
        <p>Comentario: {{ visita.comentario }}</p>
        <small>{{ visita.fecha | date:'short' }}</small>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Botón flotante redondo -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="abrirFormulario()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Modal -->
  <ion-modal [isOpen]="mostrarFormulario" (didDismiss)="cerrarFormulario()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Nueva Visita</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarFormulario()">
              <ion-icon name="close"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <div class="ion-padding">
          <!-- Imagen -->
          <ion-item>
            <ion-label position="stacked">Imagen (URL)</ion-label>
            <ion-input type="text" [(ngModel)]="nuevaVisita.img" placeholder="URL de la imagen"></ion-input>
          </ion-item>

          <!-- Sección QR -->
          <ion-item>
            <ion-label position="stacked">Código QR</ion-label>
            <ion-input type="text" [(ngModel)]="nuevaVisita.qr_code" placeholder="Código escaneado" readonly></ion-input>
          </ion-item>
          
          <div class="ion-padding-top">
            <app-qr-scanner (qrScanned)="onQrScanned($event)"></app-qr-scanner>
          </div>

          <!-- Sección Coordenadas -->
          <ion-item>
            <ion-label position="stacked">Coordenadas</ion-label>
            <ion-input type="text" [(ngModel)]="nuevaVisita.coordenadas" readonly placeholder="Se obtendrán automáticamente"></ion-input>
          </ion-item>

          <!-- Vista del mapa (solo si hay coordenadas) -->
          <div *ngIf="nuevaVisita.coordenadas && nuevaVisita.coordenadas.trim() !== ''" class="ion-padding-top">
            <app-map-view 
              [coordenadas]="nuevaVisita.coordenadas" 
              (abrirMapa)="abrirMapa($event)">
            </app-map-view>
          </div>

          <h2>Tags</h2>

          <ion-item>
            <ion-label position="stacked">Famoso</ion-label>
            <ion-select [(ngModel)]="nuevaVisita.famosos_id" interface="popover" placeholder="Selecciona un famoso">
              <ion-select-option *ngFor="let famoso of famosos" [value]="famoso.id">
                {{ famoso.nombre }}
              </ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Sitio</ion-label>
            <ion-select [(ngModel)]="nuevaVisita.sitio_id" interface="popover" placeholder="Selecciona un sitio">
              <ion-select-option *ngFor="let sitio of sitios" [value]="sitio.id">
                {{ sitio.nombre }}
              </ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Comentario</ion-label>
            <ion-textarea [(ngModel)]="nuevaVisita.comentario" placeholder="Escribe un comentario..."></ion-textarea>
          </ion-item>

          <ion-button expand="block" (click)="guardarVisita()" class="ion-margin-top">
            Guardar Visita
          </ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
